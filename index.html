<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jinnhost</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Satoshi:wght@500;700;900&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f;
            --card: #121218;
            --primary: #00d4ff;
            --text: #f0f4ff;
            --text-light: #b0b8d0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system_ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }

        .header {
            text-align: center;
            padding: 110px 20px 70px;
        }

        .header h1 {
            font-family: 'Satoshi', sans-serif;
            font-size: 5.8rem;
            font-weight: 900;
            letter-spacing: -2px;
            color: white;
            margin-bottom: 8px;
            transition: all 0.6s ease;
        }

        .header h1:hover {
            color: var(--primary);
            letter-spacing: 2px;
        }

        .message {
            font-size: 1.35rem;
            margin: 0 auto 80px;
            padding: 14px 36px;
            background: rgba(0, 212, 255, 0.08);
            border: 1px solid rgba(0, 212, 255, 0.25);
            border-radius: 60px;
            width: fit-content;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-light);
            transition: all 0.4s ease;
        }

        .message:hover {
            background: rgba(0, 212, 255, 0.15);
            transform: translateY(-3px);
        }

        .hosted-files {
            width: 86%;
            max-width: 760px;
            margin: 0 auto 120px;
            background: var(--card);
            border-radius: 24px;
            padding: 48px 42px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .hosted-files h2 {
            text-align: center;
            font-size: 1.85rem;
            font-weight: 600;
            margin-bottom: 32px;
            color: white;
            letter-spacing: -0.5px;
        }

        .tip {
            text-align: center;
            font-size: 0.98rem;
            color: var(--text-light);
            margin-bottom: 42px;
            line-height: 1.65;
        }

        .file-list {
            list-style: none;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 28px;
            margin-bottom: 12px;
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .file-item:hover {
            background: rgba(0, 212, 255, 0.1);
            transform: translateY(-4px);
        }

        .file-item span {
            font-size: 1.08rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .download-btn {
            background: var(--primary);
            color: #0a0a0f;
            padding: 12px 32px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.35s ease;
        }

        .download-btn:hover {
            background: #00b8e0;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 212, 255, 0.3);
        }

        #loading {
            text-align: center;
            color: var(--text-light);
            font-size: 1.1rem;
            margin: 50px 0;
            font-style: italic;
        }

        footer {
            position: fixed;
            bottom: 28px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.9rem;
            color: #6a7a9c;
        }

        /* Clean scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #121218;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>jinnhost</h1>
    </header>

    <div class="message">
        <i class="fas fa-discord"></i> add swouns on discord
    </div>

    <section class="hosted-files">
        <h2>Hosted Files</h2>
        <p class="tip">
            Tip: For .py files, right-click the download button and select “Save link as…”<br>
            Browsers often prefer to open Python files instead of downloading them.
        </p>
        
        <div id="loading">Loading files from GitHub...</div>
        <ul class="file-list" id="fileList"></ul>
    </section>

    <footer>
        © 2026 jinnhost — made by pluto xd
    </footer>

    <script>
        const GITHUB_USER = "hiwowxd";
        const GITHUB_REPO = "jinnhost";
        const BRANCH = "main";
        const RAW_BASE = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/${BRANCH}/`;

        async function loadFiles() {
            const fileList = document.getElementById('fileList');
            const loading = document.getElementById('loading');
            fileList.innerHTML = '';

            try {
                const treeUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/git/trees/${BRANCH}?recursive=1`;
                const response = await fetch(treeUrl, {
                    headers: { 'Accept': 'application/vnd.github.v3+json' }
                });

                if (!response.ok) throw new Error(`GitHub API error: ${response.status}`);

                const data = await response.json();
                const files = data.tree.filter(item => item.type === 'blob');

                if (files.length === 0) {
                    loading.textContent = 'No files found in the repository.';
                    return;
                }

                loading.style.display = 'none';

                files.forEach(file => {
                    const path = file.path;
                    const filename = path.split('/').pop();
                    if (filename === 'index.html') return;

                    const li = document.createElement('li');
                    li.className = 'file-item';

                    const isHtml = filename.toLowerCase().endsWith('.html');

                    let btnHtml = `
                        <button class="download-btn" onclick="forceDownload('${RAW_BASE}${path}', '${filename}')">
                            <i class="fas fa-download"></i> Download
                        </button>
                    `;

                    if (!isHtml) {
                        btnHtml = `
                            <a href="${RAW_BASE}${path}" download="${filename}" class="download-btn">
                                <i class="fas fa-download"></i> Download
                            </a>
                        `;
                    }

                    li.innerHTML = `
                        <span><i class="fas fa-file" style="color: var(--primary);"></i> ${filename}</span>
                        ${btnHtml}
                    `;

                    fileList.appendChild(li);
                });
            } catch (err) {
                console.error(err);
                loading.textContent = 'Failed to load files. Make sure the repo is public.';
            }
        }

        function forceDownload(url, filename) {
            fetch(url)
                .then(res => res.blob())
                .then(blob => {
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = filename;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(link.href);
                })
                .catch(() => {
                    alert('Download failed — try right-click → Save link as...');
                });
        }

        window.addEventListener('load', loadFiles);
    </script>
</body>
</html>
